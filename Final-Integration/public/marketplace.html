<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TradePost — Marketplace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <h1>TradePost</h1>
    <nav>
      <a href="marketplace.html" class="active">Marketplace</a>
      <a href="dashboard.html">My Negotiations</a>
      <span id="auth-status" style="margin-left:20px;"></span>
    </nav>
  </header>

  <main class="marketplace">
    <div class="marketplace-header">
      <h2>Browse Listings</h2>
      <div class="filters">
        <select disabled>
          <option>Filter by status: All</option>
          <option>Open</option>
          <option>Traded</option>
        </select>
        <input type="text" placeholder="Search items..." disabled>
      </div>
    </div>

    <!-- Real cards get inserted here by JavaScript -->
    <div class="post-grid" id="post-grid">
      <p>Loading listings...</p>
    </div>
  </main>

  <script src="js/auth-client.js"></script>
  <script>
    updateNavAuthStatus();

    function loadPosts() {
      fetch('/api/posts')
        .then(res => res.json())
        .then(posts => {
          const grid = document.getElementById('post-grid');
          grid.innerHTML = '';

          posts.forEach(post => {
            const badgeClass = post.status === 'Open' ? 'badge-open' : 'badge-traded';
            const card = document.createElement('div');
            card.className = 'post-card';
            card.innerHTML = `
              <div class="post-image">📦</div>
              <span class="badge ${badgeClass}">${post.status}</span>
              <h3>${post.title}</h3>
              <p>${post.description}</p>
              <button onclick="makeOffer(${post.post_id})" ${post.status !== 'Open' ? 'disabled' : ''}>
                Make an Offer
              </button>
            `;
            grid.appendChild(card);
          });
        })
        .catch(err => console.error('Failed to load posts:', err));
    }

    // Click handler for "Make an Offer" — this is the real, wired-up action.
    async function makeOffer(postId) {
      if (!getToken()) {
        alert('Please log in first.');
        window.location.href = 'login.html';
        return;
      }

      const details = prompt('What are you offering in exchange?');
      if (!details) return; // user cancelled

      const res = await fetch('/api/offers', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + getToken()
        },
        body: JSON.stringify({ post_id: postId, offered_item_details: details })
      });

      const data = await res.json();

      if (res.ok) {
        alert('Offer submitted!');
        // Post/Redirect/Get pattern: after a successful POST, we refresh via a
        // fresh GET load instead of just patching the page, avoiding stale/duplicate state.
        window.location.reload();
      } else {
        alert('Error: ' + data.error);
      }
    }

    loadPosts();
  </script>
</body>
</html>
